<!DOCTYPE html><html lang="vi" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>CourtGo - Đăng nhập</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            court: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="base-styles">
    /* Remove default appearance and tap highlights */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }
    /* Hide default eye icon on edge/ie */
    input::-ms-reveal,
    input::-ms-clear {
      display: none;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:py-6 text-slate-800 antialiased selection:bg-court-100 selection:text-court-800">
<!-- BEGIN: MobileDeviceFrame -->
<div class="relative w-full max-w-[420px] min-h-[920px] bg-white sm:rounded-[44px] shadow-2xl overflow-hidden flex flex-col justify-between border border-slate-100" data-purpose="mobile-container">
<!-- BEGIN: TopVisualHeader -->
<header class="relative w-full h-[270px] overflow-hidden select-none">
<div class="absolute inset-0 w-full h-full">
<img alt="CourtGo Sports Complex" class="w-full h-full object-cover object-top pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3gNPCCO2VEFLoNY2NsTxHvIGkCrNR2kSQ9nggf2O9-lbrM5KDepjQKUlLhleUR1BGIgTK-bGBkdMmtIbAuLWlLOsx0Fa434uHqKV3mG21tVa5mkhuPBE-qE2clglfwzMCnr8WvvjXZpMlzLaxkNiBL-YP-VOQtCGYKBntB1UXU05OctOP1PlKzKIF57BLHEFPG7mwjLkBW5Md3Wrgb_rN4sC3-AKWExImzLGyVjEBD5mbuOryHjJWcibRgZqKPCs91ug">
<div class="absolute inset-0 bg-gradient-to-b from-black/25 via-transparent to-black/10"></div>
</div>
<div class="relative z-20 flex justify-between items-center px-7 pt-3.5 pb-2 text-slate-900 select-none" data-purpose="ios-status-bar"><button aria-label="Quay lại" class="w-10 h-10 rounded-full bg-white/90 shadow-md flex items-center justify-center text-slate-700 hover:text-slate-900 active:scale-95 transition duration-150 cursor-pointer" type="button"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>

</header>
<!-- END: TopVisualHeader -->
<!-- BEGIN: LoginFormSection -->
<main class="relative z-30 -mt-6 bg-white rounded-t-[28px] px-6 pt-6 pb-6 flex-1 flex flex-col justify-between shadow-[0_-10px_25px_rgba(0,0,0,0.06)]">
<div>
<!-- Heading & Greeting Block -->
<div class="mb-5">
<h1 class="text-[26px] font-bold text-[#101828] tracking-tight leading-tight">
        Đăng nhập
      </h1>
<p class="mt-1 text-sm font-medium text-[#667085]">
        Chào mừng bạn trở lại CourtGo
      </p>
<p class="mt-0.5 text-[13px] text-[#667085]/80">
        Đăng nhập để đặt sân và quản lý lịch của bạn.
      </p>
</div>
<!-- Login Form -->
<form class="space-y-3.5" onsubmit="event.preventDefault();">
<!-- Input: Email / Phone -->
<div>
<label class="block text-[13px] font-medium text-[#344054] mb-1.5" for="identifier">
          Số điện thoại hoặc email
        </label>
<div class="relative flex items-center bg-[#FAFBFC] border border-[#E4E7EC] rounded-xl px-3.5 h-[52px] transition duration-200 focus-within:border-[#087F6D] focus-within:ring-2 focus-within:ring-[#087F6D]/15 focus-within:bg-white shadow-sm">
<div class="text-slate-400 mr-2.5 flex-shrink-0">
<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full bg-transparent p-0 border-none text-sm text-slate-800 placeholder-[#98A2B3] focus:ring-0 leading-normal truncate font-normal outline-none" id="identifier" placeholder="0123 456 789 hoặc email@example.com" type="text">
</div>
</div>
<!-- Input: Password -->
<div>
<label class="block text-[13px] font-medium text-[#344054] mb-1.5" for="password">
          Mật khẩu
        </label>
<div class="relative flex items-center bg-[#FAFBFC] border border-[#E4E7EC] rounded-xl px-3.5 h-[52px] transition duration-200 focus-within:border-[#087F6D] focus-within:ring-2 focus-within:ring-[#087F6D]/15 focus-within:bg-white shadow-sm">
<div class="text-slate-400 mr-2.5 flex-shrink-0">
<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full bg-transparent p-0 border-none text-sm text-slate-800 placeholder-[#98A2B3] focus:ring-0 leading-normal font-normal outline-none" id="password" placeholder="Nhập mật khẩu" type="password">
<button aria-label="Ẩn hoặc hiển thị mật khẩu" class="text-slate-400 hover:text-slate-600 p-1 transition flex-shrink-0" id="togglePassword" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password Row -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center space-x-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-[#087F6D] focus:ring-[#087F6D] border-slate-300 transition duration-150 cursor-pointer" type="checkbox">
<span class="text-[13px] font-medium text-[#475467]">Ghi nhớ đăng nhập</span>
</label>
<a class="text-[13px] font-semibold text-[#087F6D] hover:underline transition" href="#">
          Quên mật khẩu?
        </a>
</div>
<!-- Primary Login CTA -->
<button class="relative w-full h-[52px] bg-[#087F6D] hover:bg-[#066a5b] active:scale-[0.99] text-white font-semibold text-base tracking-normal rounded-xl flex items-center justify-center shadow-md shadow-[#087F6D]/20 transition duration-150 group mt-4" type="submit">
<span class="">Đăng nhập</span>
<div class="absolute right-3.5 w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-white group-hover:translate-x-0.5 transition duration-150">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</button>
</form>
<!-- Social Login Section -->
<section class="mt-5">
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-[#E4E7EC]"></div>
<span class="flex-shrink mx-3 text-xs font-medium text-[#98A2B3]">Hoặc tiếp tục với</span>
<div class="flex-grow border-t border-[#E4E7EC]"></div>
</div>
<div class="grid grid-cols-2 gap-3 mt-3">
<button class="h-12 border border-[#E4E7EC] rounded-xl flex items-center justify-center space-x-2 hover:bg-slate-50 active:scale-95 transition bg-white shadow-sm" type="button">
<svg class="w-4 h-4" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.17 0 9.99 0 12s.45 3.83 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-medium text-[#344054]">Google</span>
</button>
<button class="h-12 border border-[#E4E7EC] rounded-xl flex items-center justify-center space-x-2 hover:bg-slate-50 active:scale-95 transition bg-white shadow-sm" type="button">
<svg class="w-4 h-4 fill-slate-900" viewBox="0 0 170 170">
<path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.08-7.7-7.93-12.04-14.55-6.19-9.44-11.01-19.98-14.46-31.62-3.46-11.64-5.19-22.84-5.19-33.6 0-14.55 3.73-26.68 11.19-36.38 7.46-9.7 16.79-14.67 27.99-14.92 4.69 0 10.05 1.27 16.08 3.82 6.03 2.54 10.02 3.85 11.97 3.92 1.48-.07 5.72-1.46 12.72-4.17 7-2.71 12.76-3.87 17.28-3.48 13.06 1.07 23.36 5.86 30.91 14.37-11.58 7.02-17.27 16.63-17.06 28.84.21 9.53 3.88 17.51 11.01 23.95 7.13 6.44 15.42 10.08 24.87 10.92-2.13 6.44-4.8 12.79-8 19.06zm-38.64-106.84c0-6.16 2.23-12.02 6.69-17.58 4.46-5.56 10.01-9.49 16.65-11.78.21 1.77.32 3.42.32 4.95 0 6.09-2.34 12.04-7.02 17.85-4.68 5.81-10.4 9.68-17.16 11.61-.1-1.63-.16-3.32-.16-5.05h.68z"></path>
</svg>
<span class="text-sm font-medium text-[#344054]">Apple</span>
</button>
</div>
</section>
<!-- Register & Guest Mode Links -->
<div class="mt-4 text-center space-y-2">
<p class="text-sm font-normal text-[#475467]">
        Chưa có tài khoản? 
        <a class="font-semibold text-[#087F6D] hover:underline ml-0.5" href="#">
          Đăng ký ngay
        </a>
</p>
<div>
<a class="inline-block text-[13px] font-medium text-[#667085] hover:text-[#087F6D] transition" href="#">
          Tiếp tục với tư cách khách →
        </a>
</div>
</div>
</div>
<!-- Subtle Footer Security Note -->
<footer class="mt-4 pt-1">
<div class="flex items-center justify-center gap-1.5 text-xs text-[#98A2B3] text-center">
<svg class="w-3.5 h-3.5 fill-[#98A2B3] flex-shrink-0" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM13.707 8.707a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" fill-rule="evenodd"></path>
</svg>
<span class="">Thông tin đăng nhập được bảo mật</span>
</div>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-slate-900 rounded-full mx-auto mt-3 mb-0.5 opacity-60"></div>
</footer>
</main>
<!-- END: LoginFormSection -->
</div>
<!-- END: MobileDeviceFrame -->
<!-- BEGIN: InteractiveHandlers -->
<script data-purpose="toggle-password-visibility">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          
          // Switch icon between show & hide
          if (isPassword) {
            toggleBtn.innerHTML = `
              <svg class="w-5 h-5 text-court-700" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            `;
          } else {
            toggleBtn.innerHTML = `
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
              </svg>
            `;
          }
        });
      }
    });
  </script>
<!-- END: InteractiveHandlers -->






</body></html>
