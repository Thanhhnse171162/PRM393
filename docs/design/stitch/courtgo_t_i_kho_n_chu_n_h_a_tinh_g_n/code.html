<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="mobile_tab" name="shell-type"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #F8FAFC;
        font-family: 'Inter', sans-serif;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 12px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 antialiased min-h-screen flex flex-col justify-between">
<!-- Main Scrollable Screen Area -->
<main class="flex-1 w-full max-w-[420px] mx-auto px-4 pt-safe pb-28">
<!-- Header: Single clean top row -->
<div class="pt-6 pb-3">
<h1 class="text-[22px] font-bold text-[#0F172A] tracking-tight">Tài khoản</h1>
</div>
<!-- Profile Card -->
<section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between mb-4">
<div class="flex items-center gap-3 min-w-0">
<img alt="Minh Quân" class="w-[52px] h-[52px] rounded-full object-cover border border-slate-100 flex-shrink-0" src="https://lh3.googleusercontent.com/aida/AEtjO1U213DiuzLYVsQ3jlod5PuqwnTZ0juBtKJvx6J8MHS4Fv00Ed8b3c1NCdRElwWSASSpTIagtKooKl0H9n8cFfbHKJ_MfXb8uZIEyFXVDFlhkiMSWyrJOSQEmW1MJ4cYaDYKpc1Gks11H0656g1p1gEdw08zi7J2kfXSvheqrGHpeIJ3imwlMlk_SJ8DAQYLZHAp9jnp5g-ac8BiGoevFLtryH5R3ymLC7QOr5FkfkChWJamqSjETUqPjxTG"/>
<div class="min-w-0">
<h2 class="text-[16px] font-bold text-slate-900 leading-snug truncate" id="user-display-name">Minh Quân</h2>
<p class="text-[12px] text-slate-500 leading-tight truncate">minhquan@email.com</p>
<p class="text-[12px] text-slate-500 leading-tight mt-0.5 truncate" id="user-display-phone">0908 123 456</p>
</div>
</div>
<button class="flex-shrink-0 bg-emerald-50 text-emerald-700 text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1 border border-emerald-100/60 active:scale-95 transition-all" id="btn-edit-profile">
<span class="material-symbols-outlined text-[14px]">edit</span>
<span>Chỉnh sửa</span>
</button>
</section>
<!-- Group 1: TÀI KHOẢN -->
<section class="mt-4">
<div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-1">TÀI KHOẢN</div>
<div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
<!-- Row 1: Thông tin cá nhân -->
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-slate-50 active:bg-slate-100 transition-colors text-left" id="btn-personal-info">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[18px]">person</span>
</div>
<span class="text-[14px] text-slate-800 font-medium">Thông tin cá nhân</span>
</div>
<span class="material-symbols-outlined text-slate-400 text-[18px]">chevron_right</span>
</button>
<div class="h-[1px] bg-slate-100 mx-4"></div>
<!-- Row 2: Bảo mật & đổi mật khẩu -->
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-slate-50 active:bg-slate-100 transition-colors text-left" id="btn-security">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[18px]">lock</span>
</div>
<span class="text-[14px] text-slate-800 font-medium">Bảo mật &amp; đổi mật khẩu</span>
</div>
<span class="material-symbols-outlined text-slate-400 text-[18px]">chevron_right</span>
</button>
</div>
</section>
<!-- Group 2: TÙY CHỌN -->
<section class="mt-4">
<div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-1">TÙY CHỌN</div>
<div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
<!-- Row 1: Cài đặt thông báo -->
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-slate-50 active:bg-slate-100 transition-colors text-left" id="btn-notification-settings">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[18px]">notifications</span>
</div>
<span class="text-[14px] text-slate-800 font-medium">Cài đặt thông báo</span>
</div>
<span class="material-symbols-outlined text-slate-400 text-[18px]">chevron_right</span>
</button>
</div>
</section>
<!-- Group 3: HỖ TRỢ -->
<section class="mt-4">
<div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-1">HỖ TRỢ</div>
<div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
<!-- Row 1: Trung tâm trợ giúp -->
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-slate-50 active:bg-slate-100 transition-colors text-left" id="btn-faq">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[18px]">help</span>
</div>
<span class="text-[14px] text-slate-800 font-medium">Trung tâm trợ giúp</span>
</div>
<span class="material-symbols-outlined text-slate-400 text-[18px]">chevron_right</span>
</button>
<div class="h-[1px] bg-slate-100 mx-4"></div>
<!-- Row 2: Điều khoản & chính sách -->
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-slate-50 active:bg-slate-100 transition-colors text-left" id="btn-terms">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[18px]">description</span>
</div>
<span class="text-[14px] text-slate-800 font-medium">Điều khoản &amp; chính sách</span>
</div>
<span class="material-symbols-outlined text-slate-400 text-[18px]">chevron_right</span>
</button>
<div class="h-[1px] bg-slate-100 mx-4"></div>
<!-- Row 3: Về CourtGo -->
<button class="w-full h-[52px] px-4 flex items-center justify-between hover:bg-slate-50 active:bg-slate-100 transition-colors text-left" id="btn-about">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[18px]">info</span>
</div>
<span class="text-[14px] text-slate-800 font-medium">Về CourtGo</span>
</div>
<span class="material-symbols-outlined text-slate-400 text-[18px]">chevron_right</span>
</button>
</div>
</section>
<!-- Logout Button -->
<div class="mt-5 mb-8">
<button class="w-full bg-rose-50 border border-rose-100 text-rose-600 rounded-2xl py-3.5 px-4 font-semibold text-sm flex items-center justify-center gap-2 active:scale-[0.99] transition-transform shadow-sm" id="btn-open-logout">
<span class="material-symbols-outlined text-[20px]">logout</span>
<span>Đăng xuất</span>
</button>
</div>
</main>
<!-- Modal / Bottom Sheet: Hidden by default -->
<div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-200 hidden" id="modal-overlay"></div>
<div class="fixed inset-x-0 bottom-0 z-50 max-w-[420px] mx-auto bg-white rounded-t-3xl p-6 shadow-2xl translate-y-full transition-transform duration-300 ease-out text-center hidden" id="sheet-logout-confirm">
<div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-5"></div>
<div class="w-12 h-12 mx-auto rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-[26px]">power_settings_new</span>
</div>
<h3 class="text-[18px] font-bold text-slate-900 mb-1.5">Đăng xuất khỏi CourtGo?</h3>
<p class="text-[14px] text-slate-500 mb-6">Bạn có chắc muốn đăng xuất?</p>
<div class="grid grid-cols-2 gap-3">
<button class="h-12 rounded-xl bg-slate-100 text-slate-700 font-semibold text-sm active:scale-95 transition-transform" id="btn-cancel-logout" type="button">
        Ở lại
      </button>
<button class="h-12 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-semibold text-sm active:scale-95 transition-transform shadow-sm" id="btn-confirm-logout" type="button">
        Đăng xuất
      </button>
</div>
</div>
<!-- Toast Notification -->
<div class="fixed top-8 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 pointer-events-none opacity-0 transition-opacity duration-200" id="toast">
<span class="material-symbols-outlined text-emerald-400 text-[18px]">check_circle</span>
<span id="toast-text">Thành công</span>
</div>
<!-- Fixed Bottom Navigation (5 tabs) -->
<nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-100 pb-safe">
<div class="max-w-[420px] mx-auto h-16 px-2 flex items-center justify-around">
<!-- 1. Trang chủ -->
<a class="flex flex-col items-center justify-center flex-1 h-full text-slate-400 hover:text-slate-600 transition-colors" href="#">
<span class="material-symbols-outlined text-[22px]">home</span>
<span class="text-[10px] font-medium mt-1">Trang chủ</span>
</a>
<!-- 2. Khám phá -->
<a class="flex flex-col items-center justify-center flex-1 h-full text-slate-400 hover:text-slate-600 transition-colors" href="#">
<span class="material-symbols-outlined text-[22px]">explore</span>
<span class="text-[10px] font-medium mt-1">Khám phá</span>
</a>
<!-- 3. Lịch đặt -->
<a class="flex flex-col items-center justify-center flex-1 h-full text-slate-400 hover:text-slate-600 transition-colors" href="#">
<span class="material-symbols-outlined text-[22px]">calendar_month</span>
<span class="text-[10px] font-medium mt-1">Lịch đặt</span>
</a>
<!-- 4. Thông báo -->
<a class="flex flex-col items-center justify-center flex-1 h-full text-slate-400 hover:text-slate-600 transition-colors relative" href="#">
<div class="relative flex items-center justify-center">
<span class="material-symbols-outlined text-[22px]">notifications</span>
<span class="absolute -top-1 -right-2 min-w-[15px] h-[15px] px-1 rounded-full bg-rose-500 text-white text-[9px] font-bold flex items-center justify-center">3</span>
</div>
<span class="text-[10px] font-medium mt-1">Thông báo</span>
</a>
<!-- 5. Tài khoản (ACTIVE) -->
<a class="flex flex-col items-center justify-center flex-1 h-full text-[#0F766E] transition-colors" href="#">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-[10px] font-bold mt-1 text-[#0F766E]">Tài khoản</span>
</a>
</div>
</nav>
<script>
    (function() {
      const overlay = document.getElementById('modal-overlay');
      const logoutSheet = document.getElementById('sheet-logout-confirm');
      const btnOpenLogout = document.getElementById('btn-open-logout');
      const btnCancelLogout = document.getElementById('btn-cancel-logout');
      const btnConfirmLogout = document.getElementById('btn-confirm-logout');
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');

      function showToast(text) {
        if (toastText) toastText.textContent = text;
        if (!toast) return;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0', 'pointer-events-none');
        }, 2200);
      }

      function openLogoutModal() {
        if (!overlay || !logoutSheet) return;
        overlay.classList.remove('hidden');
        logoutSheet.classList.remove('hidden');
        requestAnimationFrame(() => {
          overlay.classList.remove('opacity-0', 'pointer-events-none');
          overlay.classList.add('opacity-100');
          logoutSheet.classList.remove('translate-y-full');
        });
      }

      function closeLogoutModal() {
        if (!overlay || !logoutSheet) return;
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0', 'pointer-events-none');
        logoutSheet.classList.add('translate-y-full');
        setTimeout(() => {
          overlay.classList.add('hidden');
          logoutSheet.classList.add('hidden');
        }, 250);
      }

      btnOpenLogout?.addEventListener('click', openLogoutModal);
      btnCancelLogout?.addEventListener('click', closeLogoutModal);
      overlay?.addEventListener('click', closeLogoutModal);

      btnConfirmLogout?.addEventListener('click', () => {
        closeLogoutModal();
        showToast('Đã đăng xuất thành công');
      });

      document.getElementById('btn-edit-profile')?.addEventListener('click', () => showToast('Mở màn hình Chỉnh sửa hồ sơ'));
      document.getElementById('btn-personal-info')?.addEventListener('click', () => showToast('Mở Thông tin cá nhân'));
      document.getElementById('btn-security')?.addEventListener('click', () => showToast('Mở Bảo mật & đổi mật khẩu'));
      document.getElementById('btn-notification-settings')?.addEventListener('click', () => showToast('Mở Cài đặt thông báo'));
      document.getElementById('btn-faq')?.addEventListener('click', () => showToast('Mở Trung tâm trợ giúp'));
      document.getElementById('btn-terms')?.addEventListener('click', () => showToast('Mở Điều khoản & chính sách'));
      document.getElementById('btn-about')?.addEventListener('click', () => showToast('CourtGo Sports App'));
    })();
  </script>
</body></html>
